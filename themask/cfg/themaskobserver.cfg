// Optional spectator keys. Run only while observing: exec themaskobserver
// F7/F8/F9 are overwritten; your regular gameplay config is not changed here.
spec_usenumberkeys_nobinds 1
bind "F7" "spec_prev"
bind "F8" "spec_next"
bind "F9" "spec_mode"
echo "[TheMask] 1-0: slots nativos; F7: anterior; F8: proximo; F9: modo de camera."
echo "[TheMask] Se usa slots personalizados do JTs, reaplique Spectator Binds depois."
